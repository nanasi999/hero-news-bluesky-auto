name: Complete posting migration
on:
  push:
    branches: [main]
    paths: [".github/workflows/complete-posting-migration.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  retire-old-queued-runs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets = [
              [32219049176, 'df52287b80a058d3f0916a28b3b854461b8a33b1'],
              [32214462577, 'df52287b80a058d3f0916a28b3b854461b8a33b1'],
              [32210877705, '902385c9e59c56dc3aca139f4c3633417d6dfa26']
            ];
            try {
              for (const [run_id, sha] of targets) {
                const args = {...context.repo, run_id};
                let {data: run} = await github.rest.actions.getWorkflowRun(args);
                if (run.status === 'completed') continue;
                if (run.status !== 'queued' || run.head_sha !== sha ||
                    run.path !== '.github/workflows/post-to-bluesky.yml') {
                  throw new Error('Unexpected old run state');
                }
                await github.rest.actions.cancelWorkflowRun(args);
                for (let n = 0; n < 18; n++) {
                  await new Promise(resolve => setTimeout(resolve, 5000));
                  ({data: run} = await github.rest.actions.getWorkflowRun(args));
                  if (run.status === 'completed') break;
                }
                if (run.status !== 'completed') throw new Error('Cancellation not confirmed');
              }
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'post-to-bluesky.yml', ref: 'main'
              });
              core.info('Old queued runs retired; normal posting verification dispatched.');
            } catch (_) {
              core.setFailed('Migration cleanup not confirmed; no additional runs changed.');
            }

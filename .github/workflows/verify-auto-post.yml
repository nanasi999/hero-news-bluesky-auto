name: Verify auto-post scripts
on:
  push:
    paths: [".github/workflows/**", "scripts/**", "release_tests.py", "requirements.txt"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt PyYAML
      - name: Real SDK and mocked transport regressions
        run: python -B release_tests.py


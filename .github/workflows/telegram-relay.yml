name: Relay existing social articles to Telegram
on:
  push:
    branches: [main]
    paths: ["telegram/**", ".github/workflows/telegram-relay.yml"]
  workflow_run:
    workflows: ["Post blog articles to Bluesky and Threads"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-heronewscom
  cancel-in-progress: false
jobs:
  relay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test telegram/relay.test.mjs telegram/translate-message.test.mjs telegram/translate-service.test.mjs
      - name: Verify live title translation on deployment
        if: github.event_name == 'push'
        run: node telegram/verify-translation-live.mjs
        env:
          TITLE_TRANSLATION_URL: https://script.google.com/macros/s/AKfycbyNgH4wWrnOUkepsLvhBQDDmHypYF9l0CRm1vf1KBgQ_icL7lXZc7dfV7VPFNhzbCZS/exec
      - run: node telegram/relay.mjs
        env:
          GH_STATE_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

name: Post blog articles to Bluesky and Threads
on:
  push:
    branches: [main]
    paths: [".github/workflows/post-to-bluesky.yml", "scripts/**"]
  schedule:
    - cron: "17,47 * * * *"
  repository_dispatch:
    types: [bluesky-auto-post]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Post and persist confirmed results
        run: python scripts/production.py --mode auto
        env:
          GH_STATE_TOKEN: ${{ github.token }}
          BLOG_RSS_URL: "https://hero-news.com/feed"
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_TOKEN_SEED: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          MAX_POSTS: "20"

